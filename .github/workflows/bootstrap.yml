name: Bootstrap repository

on:
  push:
    branches: [main]
    paths:
      - bootstrap/**
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-repository
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-extra texlive-fonts-recommended \
            texlive-science lmodern poppler-utils python3
      - name: Verify and unpack repository payload
        run: |
          cat bootstrap/repository.tar.xz.b64.part-* > bootstrap/repository.tar.xz.b64
          sha256sum -c bootstrap/repository.tar.xz.sha256
          base64 --decode bootstrap/repository.tar.xz.b64 > bootstrap/repository.tar.xz
          printf '%s  %s\n' \
            'c86ebe348d868426cb2f5f1f806a7879454b5b83e4b2dad63b9abf67386ce90d' \
            'bootstrap/repository.tar.xz' | sha256sum -c -
          tar -xJf bootstrap/repository.tar.xz
      - name: Build and verify manuscripts
        run: |
          make pdf
          make test
          make check
      - name: Replace bootstrap payload with initialized repository
        run: |
          rm -rf bootstrap .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Initialize manuscript collection and PDF archive'
          git push origin HEAD:main
