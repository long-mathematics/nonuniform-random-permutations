name: Import arXiv 2605.26107 source and PDF

on:
  push:
    branches: [add/radial-lru-paper]
    paths:
      - .github/workflows/import-radial-lru.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: add/radial-lru-paper
          fetch-depth: 0
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-extra texlive-fonts-recommended texlive-science \
            lmodern poppler-utils python3
      - name: Fetch arXiv v1 source and official PDF
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 https://arxiv.org/e-print/2605.26107v1 -o /tmp/arxiv-source
          curl --fail --location --retry 5 https://arxiv.org/pdf/2605.26107v1 -o /tmp/arxiv.pdf
          mkdir -p /tmp/arxiv-src
          tar -xf /tmp/arxiv-source -C /tmp/arxiv-src
          main_tex="$(grep -l 'Radial Extremality for LRU Caching' /tmp/arxiv-src/*.tex | head -n1)"
          test -n "$main_tex"
          mkdir -p papers/06-radial-lru-extremality output/pdf
          cp "$main_tex" papers/06-radial-lru-extremality/radial-lru-extremality.tex
      - name: Compile deterministic repository PDF
        run: |
          set -euo pipefail
          mkdir -p /tmp/radial-build
          cd papers/06-radial-lru-extremality
          SOURCE_DATE_EPOCH=1791504000 FORCE_SOURCE_DATE=1 TZ=UTC \
            latexmk -pdf -g -interaction=nonstopmode -halt-on-error -file-line-error \
              -latexoption=-no-shell-escape -outdir=/tmp/radial-build radial-lru-extremality.tex
          cp /tmp/radial-build/radial-lru-extremality.pdf ../../output/pdf/radial-lru-extremality.pdf
      - name: Verify compiled body against official arXiv PDF
        run: |
          set -euo pipefail
          pdftotext -raw output/pdf/radial-lru-extremality.pdf /tmp/compiled.txt
          pdftotext -raw /tmp/arxiv.pdf /tmp/arxiv.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          a = Path('/tmp/compiled.txt').read_text(errors='replace')
          b = Path('/tmp/arxiv.txt').read_text(errors='replace')
          needle = 'The independent reference model'
          if needle not in a or needle not in b:
              raise SystemExit('Could not locate common manuscript body')
          a = a[a.index(needle):]
          b = b[b.index(needle):]
          b = re.sub(r'arXiv:2605\\.26107v1\\s*\\[math\\.PR\\]\\s*25\\s*May\\s*2026', ' ', b)
          def tokens(s):
              s = s.replace('\\x0c', ' ').replace('\\u00ad', '')
              return [x for x in re.findall(r'\\S+', re.sub(r'\\s+', ' ', s))
                      if not re.fullmatch(r'\\d+', x)]
          if tokens(a) != tokens(b):
              raise SystemExit('Compiled manuscript body differs from arXiv v1 PDF')
          print('Verified manuscript body against arXiv:2605.26107v1')
          PY
      - name: Commit imported source and compiled PDF
        run: |
          set -euo pipefail
          rm .github/workflows/import-radial-lru.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/06-radial-lru-extremality/radial-lru-extremality.tex \
                  output/pdf/radial-lru-extremality.pdf \
                  .github/workflows/import-radial-lru.yml
          git commit -m 'Import radial LRU extremality paper from arXiv'
          git push origin HEAD:add/radial-lru-paper
