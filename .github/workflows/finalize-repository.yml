name: Finalize research archive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            poppler-utils \
            xz-utils

      - name: Download and verify repository archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            'https://filebin.net/nurp-setup-20261009-8f4c1a2d6e7b9c30/repository.tar.xz' \
            --output /tmp/repository.tar.xz
          printf '%s  %s\n' \
            'c86ebe348d868426cb2f5f1f806a7879454b5b83e4b2dad63b9abf67386ce90d' \
            '/tmp/repository.tar.xz' | sha256sum -c -

      - name: Replace bootstrap tree with final archive
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/repository.tar.xz -C .

      - name: Build PDFs
        run: make pdf

      - name: Run tests
        run: make test

      - name: Validate repository
        run: make check

      - name: Commit final repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize nonuniform random permutations research archive'
          git push origin HEAD:main
