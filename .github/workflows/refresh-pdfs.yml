name: Refresh PDF snapshots

on:
  push:
    branches: [setup/complete-repository]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install TeX and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-extra texlive-fonts-recommended texlive-science \
            lmodern poppler-utils python3 g++ make
      - name: Build PDFs and manifest
        run: make pdf
      - name: Repository tests
        run: make test
      - name: Exact finite verification
        run: make verify
      - name: Verify generated snapshots
        run: make check
      - name: Commit PDF snapshots
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/pdf
          if git diff --cached --quiet; then
            echo 'PDF snapshots already current.'
            exit 0
          fi
          git commit -m 'Build verified PDF snapshots'
          git push origin HEAD:${GITHUB_REF_NAME}
